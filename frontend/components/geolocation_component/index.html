<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #12d6a8 0%, #3284f3 58%, #9a7cf5 100%);
      color: #f8fafc;
      cursor: pointer;
      font: 800 16px/1.2 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 18px 48px rgba(18, 214, 168, 0.18);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 22px 60px rgba(50, 132, 243, 0.22);
    }

    button:disabled {
      cursor: wait;
      filter: saturate(0.72);
      opacity: 0.84;
      transform: none;
    }

    .message {
      min-height: 20px;
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
    }

    .error {
      color: #fecaca;
    }
  </style>
</head>
<body>
  <button id="location-button" type="button">Use My Live Location</button>
  <div id="message" class="message"></div>

  <script>
    const button = document.getElementById("location-button");
    const message = document.getElementById("message");

    function send(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function setFrameHeight() {
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
    }

    function setComponentValue(value) {
      send("streamlit:setComponentValue", { value, dataType: "json" });
    }

    function setMessage(text, isError = false) {
      message.textContent = text || "";
      message.className = isError ? "message error" : "message";
      setFrameHeight();
    }

    function render(event) {
      if (!event.data || event.data.type !== "streamlit:render") {
        return;
      }
      const args = event.data.args || {};
      button.textContent = args.label || "Use My Live Location";
      setFrameHeight();
    }

    button.addEventListener("click", () => {
      if (!navigator.geolocation) {
        setMessage("Location is not supported in this browser.", true);
        setComponentValue({ error: "Location is not supported in this browser." });
        return;
      }

      button.disabled = true;
      const originalLabel = button.textContent;
      button.textContent = "Detecting location...";
      setMessage("Allow location access if your browser asks.");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          button.disabled = false;
          button.textContent = originalLabel;
          setMessage("Location captured.");
          setComponentValue({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            altitude: position.coords.altitude,
            accuracy: position.coords.accuracy,
            altitudeAccuracy: position.coords.altitudeAccuracy,
            heading: position.coords.heading,
            speed: position.coords.speed,
            timestamp: Date.now(),
          });
        },
        (error) => {
          button.disabled = false;
          button.textContent = originalLabel;
          const text = error.message || "Could not capture location.";
          setMessage(text, true);
          setComponentValue({ error: text, timestamp: Date.now() });
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
      );
    });

    window.addEventListener("message", render);
    send("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  </script>
</body>
</html>
